<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>(-_-)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <h1>Template Weaver ni Bessie-waps</h1>
        <p>meow</p>
      </div>

      <div class="controls">
        <label class="btn btn-glow primary" for="fileInput">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Upload
        </label>
        <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden>
        
        <button id="exportBtn" class="btn btn-glow success" disabled>
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Export
        </button>
        
        <button id="clearBtn" class="btn ghost" disabled>Clear</button>
      </div>
    </header>
    
    <main class="content">
      <section id="preview" class="glass-card">
        <div id="tableContainer" class="table-wrapper">
          <div class="placeholder">

            <p>hehehehe</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="gifAlert" class="gif-overlay">
    <div class="gif-card">
      <img src="https://media.tenor.com/ty8f5ZoGbDZAAAAC/sir-yessir.gif" alt="Copied!" />
      <p>Copied!</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
